  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ============================================================
    // API HELPERS
    // ============================================================
    console.log('=== Open Design Lite JS Loaded ===');

    const API = {
      async get(path) {
        console.log('API GET:', path);
        try {
          const res = await fetch(`/api${path}`);
          console.log('API GET response:', res.status);
          if (!res.ok) throw new Error(`API error: ${res.status}`);
          return res.json();
        } catch (err) {
          console.error('API GET error:', path, err);
          throw err;
        }
      },
      async post(path, body) {
        const res = await fetch(`/api${path}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
          throw new Error(err.error || `API error: ${res.status}`);
        }
        return res.json();
      },
      async patch(path, body) {
        const res = await fetch(`/api${path}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
          throw new Error(err.error || `API error: ${res.status}`);
        }
        return res.json();
      },
      async del(path) {
        const res = await fetch(`/api${path}`, { method: 'DELETE' });
        if (!res.ok) {
          const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
          throw new Error(err.error || `API error: ${res.status}`);
        }
        return res.json();
      },
    };

    // ============================================================
    // SETTINGS DIALOG
    // ============================================================
    function SettingsDialog({ config, onClose, onSave }) {
      const [tab, setTab] = useState('execution');
      const [local, setLocal] = useState({ ...config });
      const [saved, setSaved] = useState(false);

      useEffect(() => {
        setLocal({ ...config });
      }, [config]);

      const handleSave = () => {
        onSave(local);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
      };

      const tabs = [
        { id: 'execution', label: 'Execution' },
        { id: 'agents', label: 'Agents' },
        { id: 'skills', label: 'Skills' },
        { id: 'design-systems', label: 'Design Systems' },
        { id: 'appearance', label: 'Appearance' },
      ];

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h2>Settings</h2>
              <button className="icon-btn" onClick={onClose}>{Icons.close}</button>
            </div>

            <div className="settings-body">
              <div className="settings-tabs">
                {tabs.map(t => (
                  <button
                    key={t.id}
                    className={`settings-tab${tab === t.id ? ' active' : ''}`}
                    onClick={() => setTab(t.id)}
                  >
                    {t.label}
                  </button>
                ))}
              </div>

              <div className="settings-content">
                {tab === 'execution' && (
                  <div className="setting-group">
                    <label>API Provider</label>
                    <select
                      value={local.apiProvider}
                      onChange={e => setLocal({ ...local, apiProvider: e.target.value })}
                    >
                      <option value="anthropic">Anthropic</option>
                      <option value="openai">OpenAI</option>
                      <option value="llamacpp">Llama.cpp Server (Local)</option>
                      <option value="ollama">Ollama (Local)</option>
                    </select>

                    {local.apiProvider === 'llamacpp' ? (
                      <>
                        <label>Server URL</label>
                        <input
                          type="text"
                          placeholder="http://localhost:8080"
                          value={local.llamaCppUrl || ''}
                          onChange={e => setLocal({ ...local, llamaCppUrl: e.target.value })}
                        />
                        <label>API Key (optional)</label>
                        <input
                          type="password"
                          placeholder="Leave blank if no auth required"
                          value={local.llamaCppKey || ''}
                          onChange={e => setLocal({ ...local, llamaCppKey: e.target.value })}
                        />
                        <label>Model</label>
                        <input
                          type="text"
                          placeholder="e.g., llama3.2, mistral"
                          value={local.model || ''}
                          onChange={e => setLocal({ ...local, model: e.target.value })}
                        />
                      </>
                    ) : local.apiProvider === 'ollama' ? (
                      <>
                        <label>Server URL</label>
                        <input
                          type="text"
                          placeholder="http://localhost:11434"
                          value={local.ollamaUrl || ''}
                          onChange={e => setLocal({ ...local, ollamaUrl: e.target.value })}
                        />
                        <label>Model</label>
                        <input
                          type="text"
                          placeholder="e.g., llama3.2, mistral, codellama"
                          value={local.model || ''}
                          onChange={e => setLocal({ ...local, model: e.target.value })}
                        />
                      </>
                    ) : (
                      <>
                        <label>API Key</label>
                        <input
                          type="password"
                          placeholder={local.apiProvider === 'anthropic' ? 'sk-ant-...' : 'sk-...'}
                          value={local.apiKey || ''}
                          onChange={e => setLocal({ ...local, apiKey: e.target.value })}
                        />

                        <label>Model</label>
                        <select
                          value={local.model}
                          onChange={e => setLocal({ ...local, model: e.target.value })}
                        >
                          {local.apiProvider === 'anthropic' ? (
                            <>
                              <option value="claude-sonnet-4-20250514">Claude Sonnet 4</option>
                              <option value="claude-opus-4-20250514">Claude Opus 4</option>
                              <option value="claude-haiku-3-5-20241022">Claude Haiku 3.5</option>
                            </>
                          ) : (
                            <>
                              <option value="gpt-4o">GPT-4o</option>
                              <option value="gpt-4o-mini">GPT-4o Mini</option>
                              <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                            </>
                          )}

                      </>
                    )}

                    <label>Max Tokens</label>
                    <input
                      type="number"
                      value={local.maxTokens || 8192}
                      onChange={e => setLocal({ ...local, maxTokens: parseInt(e.target.value) })}

              {saved && <span className="save-indicator">✓ Saved</span>}
              <button className="btn btn-primary" onClick={handleSave}>Save Changes</button>
            </div>
          </div>
        </div>
      );
    }

    function SkillsSettings({ onAddSkill }) {
      const [skills, setSkills] = useState([]);
      const [newName, setNewName] = useState('');
      const [newBody, setNewBody] = useState('');

      useEffect(() => {
        API.get('/skills').then(data => setSkills(data.skills || [])).catch(() => { });
      }, []);

      const handleAdd = async () => {
        if (!newName || !newBody) return;
        try {
          await API.post('/skills/import', {
            name: newName,
            description: `Custom skill: ${newName}`,
            body: newBody,
            triggers: []
          });
          setNewName('');
          setNewBody('');
          const data = await API.get('/skills');
          setSkills(data.skills || []);
        } catch (err) {
          alert(err.message);
        }
      };

      const handleDelete = async (id) => {
        if (!confirm('Delete this skill?')) return;
        try {
          await API.del(`/skills/${id}`);
          setSkills(skills.filter(s => s.id !== id));
        } catch (err) {
          alert(err.message);
        }
      };

      return (
        <div>
          <div className="setting-group">
            <h3>Add New Skill</h3>
            <input
              placeholder="Skill name"
              value={newName}
              onChange={e => setNewName(e.target.value)}
              className="mb-2"
            />
            <textarea
              placeholder="Skill instructions (markdown)"
              value={newBody}
              onChange={e => setNewBody(e.target.value)}
              rows={6}
              className="mb-2"
            />
            <button className="btn btn-primary" onClick={handleAdd}>Add Skill</button>
          </div>

          {skills.length > 0 && (
            <div className="setting-group">
              <h3>Installed Skills</h3>
              {skills.map(skill => (
                <div key={skill.id} className="skill-item">
                  <div>
                    <strong>{skill.name}</strong>
                    <p className="text-muted">{skill.description}</p>
                  </div>
                  <button className="btn btn-danger btn-sm" onClick={() => handleDelete(skill.id)}>
                    {Icons.trash}
                  </button>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function DesignSystemsSettings() {
      const [systems, setSystems] = useState([]);

      useEffect(() => {
        API.get('/design-systems').then(data => setSystems(data.designSystems || [])).catch(() => { });
      }, []);

      return (
        <div>
          {systems.length === 0 ? (
            <p className="text-muted">No design systems installed. Add DESIGN.md files to the design-systems/ folder.</p>
          ) : (
            <div className="setting-group">
              {systems.map(sys => (
                <div key={sys.id} className="skill-item">
                  <strong>{sys.name}</strong>
                  <p className="text-muted">{sys.description}</p>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ============================================================
    // CHAT COMPOSER
    // ============================================================
    function ChatComposer({ streaming, sendDisabled, onSend, onStop, skills }) {
      const [text, setText] = useState('');
      const textareaRef = useRef(null);

      const handleSubmit = () => {
        if (!text.trim() || sendDisabled) return;
        onSend(text.trim());
        setText('');
        if (textareaRef.current) textareaRef.current.style.height = 'auto';
      };

      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSubmit();
        }
      };

      const handleInput = () => {
        const el = textareaRef.current;
        if (el) {
          el.style.height = 'auto';
          el.style.height = Math.min(el.scrollHeight, 200) + 'px';
        }
      };

      return (
        <div className="chat-composer">
          <textarea
            ref={textareaRef}
            value={text}
            onChange={e => setText(e.target.value)}
            onKeyDown={handleKeyDown}
            onInput={handleInput}
            placeholder={streaming ? 'Agent is working...' : 'Describe what you want to build...'}
            disabled={streaming}
            rows={1}
          />
          <div className="composer-actions">
            {streaming ? (
              <button className="btn btn-secondary" onClick={onStop}>
                {Icons.stop} Stop
              </button>
            ) : (
              <button
                className="btn btn-primary"
                onClick={handleSubmit}
                disabled={!text.trim() || sendDisabled}
              >
                {Icons.send} Send
              </button>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // CHAT PANE
    // ============================================================
    function ChatPane({ messages, streaming, sendDisabled, onSend, onStop, skills }) {
      const [convListOpen, setConvListOpen] = useState(false);
      const logRef = useRef(null);

      useEffect(() => {
        if (logRef.current) {
          logRef.current.scrollTop = logRef.current.scrollHeight;
        }
      }, [messages]);

      return (
        <div className="chat-pane">
          <div className="chat-header">
            <button className="icon-btn" onClick={() => setConvListOpen(!convListOpen)}>
              {Icons.history}
            </button>
            <button className="icon-btn" title="New conversation">
              {Icons.plus}
            </button>
          </div>

          <div className="chat-log" ref={logRef}>
            {messages.length === 0 ? (
              <div className="chat-empty">
                <h3>What would you like to build?</h3>
                <p>Describe your project and I'll generate the code for you.</p>
                <div className="starter-prompts">
                  {[
                    { title: 'Landing Page', prompt: 'Build a modern landing page for a SaaS product with hero section, features, pricing, and footer' },
                    { title: 'Dashboard', prompt: 'Create a analytics dashboard with charts, stats cards, and a data table' },
                    { title: 'Todo App', prompt: 'Build a todo app with add, complete, delete, and filter functionality' },
                  ].map((ex, i) => (
                    <button
                      key={i}
                      className="starter-prompt"
                      onClick={() => onSend(ex.prompt)}
                    >
                      <span>{ex.title}</span>
                      <small>{ex.prompt.slice(0, 60)}...</small>
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              messages.map((msg, i) => (
                <div key={i} className={`message ${msg.role}`}>
                  <div className="message-role">{msg.role === 'user' ? 'You' : 'Assistant'}</div>
                  <div className="message-content">{msg.content}</div>
                </div>
              ))
            )}
            {streaming && (
              <div className="message assistant">
                <div className="message-role">Assistant</div>
                <div className="message-content streaming">
                  <div className="typing-indicator">
                    <span></span><span></span><span></span>
                  </div>
                </div>
              </div>
            )}
          </div>

          <ChatComposer
            streaming={streaming}
            sendDisabled={sendDisabled}
            onSend={onSend}
            onStop={onStop}
            skills={skills}
          />
        </div>
      );
    }

    // PROJECT VIEW (main workspace)
    // ============================================================
    function ProjectView({ project, config, onBack }) {
      const [messages, setMessages] = useState([]);
      const [streaming, setStreaming] = useState(false);
      const [artifactHtml, setArtifactHtml] = useState(null);
      const [breakpoint, setBreakpoint] = useState('desktop');
      const [selectedElement, setSelectedElement] = useState(null);
      const [editMode, setEditMode] = useState(false);
      const [tweakPrompt, setTweakPrompt] = useState('');
      const [showTweakInput, setShowTweakInput] = useState(false);
      const [elementEditPrompt, setElementEditPrompt] = useState('');
      const [showSource, setShowSource] = useState(true);
      const [timer, setTimer] = useState(0);
      const [saveToast, setSaveToast] = useState(null); // { message, type }
      const [sourceEditValue, setSourceEditValue] = useState(''); // For editable source mode
      const [highlightedLines, setHighlightedLines] = useState([]); // Line numbers to highlight
      const iframeRef = useRef(null);
      const textareaRef = useRef(null);
      const preRef = useRef(null);
      let elementIdCounter = 0;

      // Load existing project code on mount
      useEffect(() => {
        API.get(`/projects/${project.id}/files/index.html`)
          .then(data => {
            if (data.content) {
              setArtifactHtml(data.content);
              setSourceEditValue(data.content);
            }
          })
          .catch(() => {});
      }, [project.id]);

      // Sync source edit value when artifact changes (from AI generation, etc.)
      useEffect(() => {
        if (artifactHtml && !sourceEditValue) {
          setSourceEditValue(artifactHtml);
        }
      }, [artifactHtml]);

      // Timer for streaming duration
      useEffect(() => {
        let interval;
        if (streaming) {
          setTimer(0);
          interval = setInterval(() => setTimer(t => t + 1), 1000);
        }
        return () => clearInterval(interval);
      }, [streaming]);

      // Auto-dismiss toast after 3 seconds
      useEffect(() => {
        if (saveToast) {
          const t = setTimeout(() => setSaveToast(null), 3000);
          return () => clearTimeout(t);
        }
      }, [saveToast]);

      const attachEditListeners = (iframeDoc) => {
        if (!iframeDoc) return;

        // Add selection styles once
        if (!iframeDoc.getElementById('od-selection-styles')) {
          const style = iframeDoc.createElement('style');
          style.id = 'od-selection-styles';
          style.innerHTML = `
            .od-hovered { outline: 2px dashed rgba(59, 130, 246, 0.8) !important; outline-offset: -2px !important; cursor: pointer !important; }
            .od-selected { outline: 2px solid rgb(59, 130, 246) !important; outline-offset: -2px !important; }
          `;
          iframeDoc.head.appendChild(style);
        }

        // Add data-od-id attributes to all elements for source mapping
        if (!iframeDoc.getElementById('od-id-attributes')) {
          const allElements = iframeDoc.querySelectorAll('*');
          allElements.forEach(el => {
            if (!el.hasAttribute('data-od-id')) {
              el.setAttribute('data-od-id', `od-${++elementIdCounter}`);
            }
          });
          iframeDoc.getElementById('od-selection-styles').insertAdjacentHTML('afterend', '<style id="od-id-attributes">[data-od-id] { position: relative; }</style>');
        }

        const handleMouseOver = (e) => {
          e.stopPropagation();
          if (['html', 'body'].includes(e.target.tagName.toLowerCase())) return;
          e.target.classList.add('od-hovered');
        };

        const handleMouseOut = (e) => {
          e.target.classList.remove('od-hovered');
        };

        const handleClick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          const target = e.target;
          
          if (['html', 'body'].includes(target.tagName.toLowerCase())) {
            iframeDoc.querySelectorAll('.od-selected').forEach(el => el.classList.remove('od-selected'));
            setSelectedElement(null);
            return;
          }
          
          iframeDoc.querySelectorAll('.od-selected').forEach(el => el.classList.remove('od-selected'));
          target.classList.add('od-selected');
          
          const clone = target.cloneNode(true);
          clone.classList.remove('od-selected', 'od-hovered');
          if (clone.classList.length === 0) clone.removeAttribute('class');
          
          const fullDocClone = iframeDoc.documentElement.cloneNode(true);
          fullDocClone.querySelectorAll('.od-selected, .od-hovered').forEach(el => {
            el.classList.remove('od-selected', 'od-hovered');
            if (el.classList.length === 0) el.removeAttribute('class');
          });

          setSelectedElement({
            html: clone.outerHTML,
            tagName: target.tagName.toLowerCase(),
            classes: clone.className || '',
            id: target.id || '',
            parentTag: target.parentElement?.tagName?.toLowerCase() || '',
            fullHtml: fullDocClone.outerHTML,
            ref: target,
            odId: target.getAttribute('data-od-id') || '',
            styles: {
              fontFamily: target.style.fontFamily || '',
              fontSize: target.style.fontSize ? target.style.fontSize.replace('px', '') : '',
              fontWeight: target.style.fontWeight || '',
              color: target.style.color || '',
              textAlign: target.style.textAlign || '',
              lineHeight: target.style.lineHeight || '',
              letterSpacing: target.style.letterSpacing || '',
              width: target.style.width || '',
              height: target.style.height || '',
              gap: target.style.gap || '',
              flexDirection: target.style.flexDirection || '',
              justifyContent: target.style.justifyContent || '',
              alignItems: target.style.alignItems || '',
              backgroundColor: target.style.backgroundColor || '',
              paddingTop: target.style.paddingTop ? target.style.paddingTop.replace('px', '') : '',
              paddingRight: target.style.paddingRight ? target.style.paddingRight.replace('px', '') : '',
              paddingBottom: target.style.paddingBottom ? target.style.paddingBottom.replace('px', '') : '',
              paddingLeft: target.style.paddingLeft ? target.style.paddingLeft.replace('px', '') : '',
              marginTop: target.style.marginTop ? target.style.marginTop.replace('px', '') : '',
              marginRight: target.style.marginRight ? target.style.marginRight.replace('px', '') : '',
              marginBottom: target.style.marginBottom ? target.style.marginBottom.replace('px', '') : '',
              marginLeft: target.style.marginLeft ? target.style.marginLeft.replace('px', '') : '',
              borderWidth: target.style.borderWidth ? target.style.borderWidth.replace('px', '') : '',
              borderColor: target.style.borderColor || '',
              borderStyle: target.style.borderStyle || '',
              borderRadius: target.style.borderRadius ? target.style.borderRadius.replace('px', '') : '',
            }
          });
        };

        iframeDoc.addEventListener('mouseover', handleMouseOver);
        iframeDoc.addEventListener('mouseout', handleMouseOut);
        iframeDoc.addEventListener('click', handleClick);
      };

      const removeEditListeners = (iframeDoc) => {
        if (!iframeDoc) return;
        const style = iframeDoc.getElementById('od-selection-styles');
        if (style) style.remove();
      };

      useEffect(() => {
        if (editMode && artifactHtml && iframeRef.current) {
          const iframeDoc = iframeRef.current.contentDocument;
          attachEditListeners(iframeDoc);
        } else {
          if (iframeRef.current) {
            const iframeDoc = iframeRef.current.contentDocument;
            removeEditListeners(iframeDoc);
          }
          if (!editMode) {
            setSelectedElement(null);
          }
        }
      }, [editMode, artifactHtml]);

      const handleIframeLoad = () => {
        // Selection listeners are attached via editMode useEffect
        // Also re-attach data-od-id attributes in case iframe was reloaded
        if (editMode && iframeRef.current) {
          const iframeDoc = iframeRef.current.contentDocument;
          if (iframeDoc) {
            // Check if elements already have data-od-id, if not add them
            const hasIds = iframeDoc.querySelector('[data-od-id]');
            if (!hasIds) {
              const allElements = iframeDoc.querySelectorAll('*');
              allElements.forEach(el => {
                if (!el.hasAttribute('data-od-id')) {
                  el.setAttribute('data-od-id', `od-${++elementIdCounter}`);
                }
              });
            }
          }
        }
      };

      // Find line numbers in source that contain a given element's HTML
      const findElementLines = (sourceCode, elementInfo) => {
        if (!elementInfo || !sourceCode) return [];
        
        const lines = sourceCode.split('\n');
        const foundLines = [];
        
        // Try to find the element by its tag name and attributes
        const tagPattern = elementInfo.tagName;
        const idAttr = elementInfo.id ? `\\s+id=["']${elementInfo.id}["']` : '';
        const classAttr = elementInfo.classes ? `\\s+class=["'][^"']*${elementInfo.classes.split(' ')[0]}[^"']*["']` : '';
        
        const regexPattern = `<${tagPattern}${idAttr}${classAttr}`;
        const regex = new RegExp(regexPattern, 'i');
        
        lines.forEach((line, index) => {
          if (regex.test(line.trim())) {
            foundLines.push(index);
          }
        });
        
        // If no exact match, try finding by the element's HTML content
        if (foundLines.length === 0 && elementInfo.html) {
          const htmlSearch = elementInfo.html.substring(0, 50); // First 50 chars of element
          lines.forEach((line, index) => {
            if (line.includes(htmlSearch)) {
              foundLines.push(index);
            }
          });
        }
        
        return foundLines.length > 0 ? foundLines : [0];
      };

      // Update highlighted lines when selected element changes
      useEffect(() => {
        if (showSource && selectedElement && sourceEditValue) {
          const lines = findElementLines(sourceEditValue, selectedElement);
          setHighlightedLines(lines);
        } else {
          setHighlightedLines([]);
        }
      }, [selectedElement, showSource, sourceEditValue]);

      // Handle source code changes and sync back to artifact
      let sourceChangeTimeout = null;
      const handleSourceChange = (newCode) => {
        setSourceEditValue(newCode);
        
        // Debounced sync to preview and right panel
        if (sourceChangeTimeout) clearTimeout(sourceChangeTimeout);
        sourceChangeTimeout = setTimeout(() => {
          setArtifactHtml(newCode);
          
          // If an element is selected, try to re-parse its styles from the new code
          if (selectedElement && selectedElement.odId) {
            const iframeDoc = iframeRef.current?.contentDocument;
            if (iframeDoc) {
              // Reload iframe with new code
              iframeRef.current.srcDoc = newCode;
              
              // Find the element in the new DOM and update its ref
              const newEl = iframeDoc.querySelector(`[data-od-id="${selectedElement.odId}"]`);
              if (newEl) {
                const clone = newEl.cloneNode(true);
                clone.classList.remove('od-selected', 'od-hovered');
                if (clone.classList.length === 0) clone.removeAttribute('class');
                
                const fullDocClone = iframeDoc.documentElement.cloneNode(true);
                fullDocClone.querySelectorAll('.od-selected, .od-hovered').forEach(el => {
                  el.classList.remove('od-selected', 'od-hovered');
                  if (el.classList.length === 0) el.removeAttribute('class');
                });

                setSelectedElement({
                  ...selectedElement,
                  html: clone.outerHTML,
                  fullHtml: fullDocClone.outerHTML,
                  ref: newEl,
                  styles: {
                    fontFamily: newEl.style.fontFamily || '',
                    fontSize: newEl.style.fontSize ? newEl.style.fontSize.replace('px', '') : '',
                    fontWeight: newEl.style.fontWeight || '',
                    color: newEl.style.color || '',
                    textAlign: newEl.style.textAlign || '',
                    lineHeight: newEl.style.lineHeight || '',
                    letterSpacing: newEl.style.letterSpacing || '',
                    width: newEl.style.width || '',
                    height: newEl.style.height || '',
                    gap: newEl.style.gap || '',
                    flexDirection: newEl.style.flexDirection || '',
                    justifyContent: newEl.style.justifyContent || '',
                    alignItems: newEl.style.alignItems || '',
                    backgroundColor: newEl.style.backgroundColor || '',
                    paddingTop: newEl.style.paddingTop ? newEl.style.paddingTop.replace('px', '') : '',
                    paddingRight: newEl.style.paddingRight ? newEl.style.paddingRight.replace('px', '') : '',
                    paddingBottom: newEl.style.paddingBottom ? newEl.style.paddingBottom.replace('px', '') : '',
                    paddingLeft: newEl.style.paddingLeft ? newEl.style.paddingLeft.replace('px', '') : '',
                    marginTop: newEl.style.marginTop ? newEl.style.marginTop.replace('px', '') : '',
                    marginRight: newEl.style.marginRight ? newEl.style.marginRight.replace('px', '') : '',
                    marginBottom: newEl.style.marginBottom ? newEl.style.marginBottom.replace('px', '') : '',
                    marginLeft: newEl.style.marginLeft ? newEl.style.marginLeft.replace('px', '') : '',
                    borderWidth: newEl.style.borderWidth ? newEl.style.borderWidth.replace('px', '') : '',
                    borderColor: newEl.style.borderColor || '',
                    borderStyle: newEl.style.borderStyle || '',
                    borderRadius: newEl.style.borderRadius ? newEl.style.borderRadius.replace('px', '') : '',
                  }
                });
              }
            }
          }
        }, 300);
      };

      const handleUpdateStyle = (prop, value) => {
        if (!selectedElement || !selectedElement.ref) return;
        selectedElement.ref.style[prop] = value;
        setSelectedElement({...selectedElement, styles: {...selectedElement.styles, [prop]: value}});
        
        const iframeDoc = iframeRef.current?.contentDocument;
        if (iframeDoc) {
          const fullDocClone = iframeDoc.documentElement.cloneNode(true);
          fullDocClone.querySelectorAll('.od-selected, .od-hovered').forEach(el => {
            el.classList.remove('od-selected', 'od-hovered');
            if (el.classList.length === 0) el.removeAttribute('class');
          });
          setArtifactHtml(fullDocClone.outerHTML);
        }
      };

      const handleSend = useCallback(async (text, elementContext = null) => {
        const newMsgs = [...messages, { role: 'user', content: text }];
        setMessages(newMsgs);
        setStreaming(true);
        if (!elementContext) setArtifactHtml(null);

        try {
          const payload = {
            messages: newMsgs,
            model: config.model,
            maxTokens: config.maxTokens,
            skillBody: '',
          };

          if (elementContext) {
            payload.elementContext = elementContext;
            payload.userInstruction = text;
          }

          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            setStreaming(false);
            return;
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let fullResponseText = '';

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value);
            const lines = chunk.split('\n');

            for (const line of lines) {
              if (!line.startsWith('data: ')) continue;
              const data = line.slice(6);
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                if (parsed.type === 'content' && parsed.delta) {
                  fullResponseText += parsed.delta;
                }
              } catch {}
            }
          }

          const artifactMatch = fullResponseText.match(/<artifact[^>]*>([\s\S]*?)<\/artifact>/);
          if (artifactMatch) {
            setArtifactHtml(artifactMatch[1]);
          }
          setStreaming(false);
        } catch (err) {
          setStreaming(false);
        }
      }, [messages, config]);

      const mins = Math.floor(timer / 60);
      const secs = timer % 60;
      const timeStr = `${mins}m ${secs}s`;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', height: '100vh', fontFamily: 'system-ui, sans-serif' }}>
          {/* Top Navbar */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 16px', borderBottom: '1px solid #e5e7eb', background: '#fff' }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', fontWeight: 'bold' }}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-10 10"/></svg>
                Open Design
              </div>
              <div style={{ color: '#9ca3af', cursor: 'pointer' }} onClick={onBack}>←</div>
              <div style={{ fontWeight: '500' }}>{project.name}</div>
              <div style={{ fontSize: '12px', color: '#6b7280', background: '#f3f4f6', padding: '2px 6px', borderRadius: '4px' }}>TARGETS Responsive web</div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
              {artifactHtml && (
                <button 
                  onClick={() => {
                    const blob = new Blob([artifactHtml], { type: 'text/html' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${project.name.replace(/[^a-zA-Z0-9]/g, '_')}.html`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                  }}
                  style={{ padding: '6px 12px', border: '1px solid #e5e7eb', borderRadius: '6px', background: '#fff', fontSize: '13px', display: 'flex', alignItems: 'center', gap: '4px' }}
                >
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><polyline points="7 10 12 15 17 10" /><line x1="12" y1="15" x2="12" y2="3" /></svg>
                  Download
                </button>
              )}
              {artifactHtml && (
                <button 
                  onClick={async () => {
                    try {
                      await API.post(`/projects/${project.id}/files`, {
                        filePath: 'index.html',
                        content: artifactHtml
                      });
                      setSaveToast({ message: '✓ Saved to project!', type: 'success' });
                    } catch (err) {
                      setSaveToast({ message: '✗ Save failed: ' + err.message, type: 'error' });
                    }
                  }}
                  style={{ padding: '6px 12px', border: 'none', borderRadius: '6px', background: '#ecfdf5', color: '#059669', fontSize: '13px', display: 'flex', alignItems: 'center', gap: '4px', cursor: 'pointer', transition: 'all 0.2s' }}
                  onMouseEnter={e => { e.currentTarget.style.background = '#d1fae5'; }}
                  onMouseLeave={e => { e.currentTarget.style.background = '#ecfdf5'; }}
                >
                  Save to Project
                </button>
              )}
              <button style={{ padding: '6px 12px', border: '1px solid #e5e7eb', borderRadius: '6px', background: '#fff', fontSize: '13px' }}>Present ⌄</button>
              <button style={{ padding: '6px 12px', border: 'none', borderRadius: '6px', background: '#000', color: '#fff', fontSize: '13px' }}>Share ⌄</button>
            </div>
          </div>

          <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
            {/* Left Pane: Code & Chat */}
            <div style={{ width: showSource ? '0px' : '300px', minWidth: showSource ? '0px' : '300px', maxWidth: showSource ? '0px' : '300px', display: 'flex', flexDirection: 'column', borderRight: showSource ? 'none' : '1px solid #e5e7eb', background: '#fff', overflow: 'hidden', transition: 'all 0.2s ease' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', padding: '8px', borderBottom: '1px solid #e5e7eb' }}>
                <div style={{ display: 'flex', gap: '4px' }}>
                  <button style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: '#6b7280' }}>+</button>
                  <button style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: '#6b7280' }}>{'<'}</button>
                </div>
              </div>
              <div style={{ flex: 1, overflow: 'auto', padding: '16px', fontSize: '11px', fontFamily: 'monospace', whiteSpace: 'pre-wrap', color: '#374151', wordBreak: 'break-all' }}>
                {!showSource && (artifactHtml || '<!-- No code generated yet -->')}
              </div>
              <div style={{ padding: '16px', borderTop: '1px solid #e5e7eb' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '8px', fontSize: '12px', color: '#6b7280' }}>
                  {streaming ? (
                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                      <div className="spinner" style={{ width: '8px', height: '8px', border: '2px solid #e5e7eb', borderTopColor: '#000', borderRadius: '50%', animation: 'od-spin 1s linear infinite' }} />
                      Generating... {timeStr}
                    </div>
                  ) : (
                    <div>• Done {timeStr}</div>
                  )}
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <span style={{ cursor: 'pointer' }}>👍</span><span style={{ cursor: 'pointer' }}>👎</span>
                  </div>
                </div>
                <ChatComposer streaming={streaming} sendDisabled={streaming} onSend={handleSend} onStop={() => setStreaming(false)} skills={[]} />
              </div>
            </div>

            {/* Middle Pane: Preview */}
            <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#f9fafb' }}>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '8px 16px', background: '#fff', borderBottom: '1px solid #e5e7eb' }}>
                <div style={{ display: 'flex', gap: '16px', fontSize: '13px' }}>
                  <button 
                    onClick={() => { setShowSource(false); }}
                    style={{ border: 'none', background: 'transparent', color: !showSource ? '#000' : '#6b7280', cursor: 'pointer', fontWeight: !showSource ? 'bold' : 'normal', borderBottom: !showSource ? '2px solid #000' : 'none', paddingBottom: '4px' }}
                  >Preview</button>
                  <button 
                    onClick={() => { setShowSource(true); }}
                    style={{ border: 'none', background: 'transparent', color: showSource ? '#000' : '#6b7280', cursor: 'pointer', fontWeight: showSource ? 'bold' : 'normal', borderBottom: showSource ? '2px solid #000' : 'none', paddingBottom: '4px' }}
                  >Source</button>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '16px', fontSize: '13px' }}>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button 
                      onClick={() => { setShowTweakInput(!showTweakInput); setEditMode(false); setSelectedElement(null); }}
                      style={{ border: 'none', background: showTweakInput ? '#fef3c7' : 'transparent', color: showTweakInput ? '#d97706' : '#6b7280', padding: '2px 8px', borderRadius: '4px', cursor: 'pointer', fontWeight: showTweakInput ? 'bold' : 'normal' }}
                    >
                      Tweaks
                    </button>
                    <button 
                      onClick={() => { setEditMode(!editMode); setShowTweakInput(false); if (!editMode) setSelectedElement(null); }}
                      style={{ border: 'none', background: editMode ? '#fef3c7' : 'transparent', color: editMode ? '#d97706' : '#6b7280', padding: '2px 8px', borderRadius: '4px', cursor: 'pointer', fontWeight: editMode ? 'bold' : 'normal' }}
                    >
                      Edit
                    </button>
                    <button 
                      onClick={() => alert('Draw feature coming soon!')}
                      style={{ border: 'none', background: 'transparent', color: '#6b7280', cursor: 'pointer' }}
                    >
                      Draw
                    </button>
                  </div>
                  <div style={{ display: 'flex', gap: '8px', borderLeft: '1px solid #e5e7eb', borderRight: '1px solid #e5e7eb', padding: '0 16px' }}>
                    <button onClick={() => setBreakpoint('desktop')} style={{ border: 'none', background: 'transparent', cursor: 'pointer', fontWeight: breakpoint === 'desktop' ? 'bold' : 'normal' }}>Desktop</button>
                    <button onClick={() => setBreakpoint('tablet')} style={{ border: 'none', background: 'transparent', cursor: 'pointer', fontWeight: breakpoint === 'tablet' ? 'bold' : 'normal' }}>Tablet</button>
                    <button onClick={() => setBreakpoint('mobile')} style={{ border: 'none', background: 'transparent', cursor: 'pointer', fontWeight: breakpoint === 'mobile' ? 'bold' : 'normal' }}>Mobile</button>
                  </div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    <button style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: '#6b7280' }}>-</button>
                    <span>100%</span>
                    <button style={{ border: 'none', background: 'transparent', cursor: 'pointer', color: '#6b7280' }}>+</button>
                  </div>
                </div>
              </div>
              {showTweakInput && (
                <div style={{ padding: '12px 16px', background: '#fff', borderBottom: '1px solid #e5e7eb', display: 'flex', gap: '8px' }}>
                  <input
                    style={{ flex: 1, padding: '8px 12px', border: '1px solid #e5e7eb', borderRadius: '6px', fontSize: '13px', outline: 'none' }}
                    placeholder="Describe your tweak (e.g., 'Make the header blue', 'Add more spacing')"
                    value={tweakPrompt}
                    onChange={e => setTweakPrompt(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter' && tweakPrompt.trim()) { handleSend(tweakPrompt.trim()); setShowTweakInput(false); setTweakPrompt(''); } }}
                    autoFocus
                  />
                  <button
                    onClick={() => { if (tweakPrompt.trim()) { handleSend(tweakPrompt.trim()); setShowTweakInput(false); setTweakPrompt(''); } }}
                    disabled={!tweakPrompt.trim()}
                    style={{ padding: '8px 16px', border: 'none', borderRadius: '6px', background: tweakPrompt.trim() ? '#000' : '#e5e7eb', color: tweakPrompt.trim() ? '#fff' : '#9ca3af', cursor: tweakPrompt.trim() ? 'pointer' : 'default', fontSize: '13px' }}
                  >
                    Apply
                  </button>
                </div>
              )}
              <div style={{ flex: 1, padding: '32px', display: 'flex', justifyContent: 'center', alignItems: 'flex-start', overflow: 'auto' }}>
                {showSource ? (
                  sourceEditValue ? (
                    <div style={{ 
                      background: '#1e1e1e', 
                      width: '100%', 
                      height: '100%', 
                      overflow: 'hidden',
                      display: 'flex',
                      flexDirection: 'column',
                      fontFamily: "'Menlo', 'Monaco', 'Courier New', monospace",
                      fontSize: '13px'
                    }}>
                      {/* Source editor with line numbers */}
                      <div style={{ flex: 1, display: 'flex', overflow: 'hidden', position: 'relative' }}>
                        {/* Line numbers gutter */}
                        <div style={{ 
                          width: '50px', 
                          minWidth: '50px',
                          background: '#252526', 
                          color: '#858585', 
                          textAlign: 'right', 
                          paddingRight: '12px',
                          paddingTop: '16px',
                          userSelect: 'none',
                          borderRight: '1px solid #3c3c3c',
                          overflow: 'hidden'
                        }}>
                          {sourceEditValue.split('\n').map((_, i) => (
                            <div 
                              key={i} 
                              style={{ 
                                height: '20px', 
                                lineHeight: '20px',
                                background: highlightedLines.includes(i) ? '#264f78' : 'transparent',
                                color: highlightedLines.includes(i) ? '#dcdcaa' : '#858585'
                              }}
                            >
                              {i + 1}
                            </div>
                          ))}
                        </div>
                        
                        {/* Code editor area - textarea on top of highlighted pre */}
                        <div style={{ flex: 1, position: 'relative', overflow: 'hidden' }}>
                          {/* Syntax highlighted background (non-editable) */}
                          <pre 
                            ref={preRef}
                            style={{ 
                              position: 'absolute',
                              top: 0,
                              left: 0,
                              margin: 0,
                              padding: '16px',
                              fontFamily: "'Menlo', 'Monaco', 'Courier New', monospace",
                              fontSize: '13px',
                              lineHeight: '20px',
                              whiteSpace: 'pre-wrap',
                              wordBreak: 'break-all',
                              tabSize: 2,
                              color: '#d4d4d4',
                              pointerEvents: 'none',
                              zIndex: 1,
                              overflow: 'hidden'
                            }}
                            dangerouslySetInnerHTML={{ __html: Prism.highlight(sourceEditValue, Prism.languages.html, 'html').replace(/\t/g, '&nbsp;&nbsp;').replace(/\n/g, '<br/>') }}
                          />
                          
                          {/* Editable textarea (transparent text, visible caret) */}
                          <textarea
                            ref={textareaRef}
                            value={sourceEditValue}
                            onChange={(e) => handleSourceChange(e.target.value)}
                            onScroll={(e) => {
                              if (preRef.current) {
                                preRef.current.scrollTop = e.target.scrollTop;
                                preRef.current.scrollLeft = e.target.scrollLeft;
                              }
                            }}
                            style={{ 
                              position: 'absolute',
                              top: 0,
                              left: 0,
                              margin: 0,
                              padding: '16px',
                              width: '100%',

                  <p style={{ margin: 0, fontSize: '11px', color: '#6b7280', lineHeight: '1.3' }}>
                    {sys.description}
                  </p>
                </div>

                  style={{ width: '16px', height: '16px', accentColor: '#f97316' }}
                />
              </div>
            ))}
            
            {/* Built-in Anthropic Design System */}
            <div
              onClick={() => onSelect({ id: 'claude', name: 'Claude (Anthropic)', description: 'Anthropic\'s AI assistant. Warm terracotta & cream palette.', isBuiltIn: true })}
              style={{
                display: 'flex',
                alignItems: 'center',
                gap: '12px',
                padding: '10px 12px',
                borderRadius: '8px',
                cursor: 'pointer',
                background: selectedId === 'claude' ? '#fff7ed' : 'transparent',
                border: selectedId === 'claude' ? '1px solid #fed7aa' : '1px solid transparent',
                marginTop: '4px'
              }}
            >
              <div style={{ 
                width: '32px', 
                height: '32px', 
                borderRadius: '6px', 
                background: 'linear-gradient(135deg, #ff6b35 50%, #f7c59f 50%)',
                display: 'flex', 
                alignItems: 'center', 
                justifyContent: 'center',
                fontSize: '14px'
              }}>
                🟠
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                  <span style={{ fontWeight: selectedId === 'claude' ? '600' : '500', fontSize: '13px', color: '#111827' }}>
                    Claude (Anthropic)
                  </span>
                </div>
                <p style={{ margin: 0, fontSize: '11px', color: '#6b7280', lineHeight: '1.3' }}>
                  Anthropic's AI assistant. Warm terracotta & cream palette.
                </p>
              </div>
              <input
                type={mode === 'single' ? 'radio' : 'checkbox'}
                checked={selectedId === 'claude'}
                onChange={() => onSelect({ id: 'claude', name: 'Claude (Anthropic)', description: "Anthropic's AI assistant. Warm terracotta & cream palette.", isBuiltIn: true })}
                style={{ width: '16px', height: '16px', accentColor: '#f97316' }}
              />
            </div>

            {filtered.length === 0 && (
              <div style={{ padding: '20px', textAlign: 'center', color: '#9ca3af', fontSize: '13px' }}>
                No design systems found
              </div>
            )}
          </div>
        </div>
      );
    }

    // ============================================================
    // ENTRY VIEW (Plan Mode + Recent Projects)
    // ============================================================
    function EntryView({ onOpenProject, onSettings }) {
      const [projects, setProjects] = useState([]);
      const [designSystems, setDesignSystems] = useState([]);
      const [showDesignSystemDropdown, setShowDesignSystemDropdown] = useState(false);
      const [projectName, setProjectName] = useState('');
      const [selectedDesignSystem, setSelectedDesignSystem] = useState(null);
      const [fidelity, setFidelity] = useState('high'); // 'wireframe' or 'high'
      const [includeLanding, setIncludeLanding] = useState(false);
      const [includeOSWidgets, setIncludeOSWidgets] = useState(false);
      const [activeTab, setActiveTab] = useState('prototype'); // 'prototype', 'live-artifact', 'slide-deck'

      useEffect(() => {
        API.get('/projects').then(data => {
          setProjects(data.projects || []);
        }).catch(() => {});

        API.get('/design-systems').then(data => {
          const systems = data.designSystems || [];
          // Set default to neutral-modern if available
          const neutral = systems.find(s => s.id === 'neutral-modern');
          setDesignSystems(systems);
          setSelectedDesignSystem(neutral || null);
        }).catch(() => {});
      }, []);

      const handleCreateProject = async () => {
        if (!projectName.trim()) return;

        try {
          // Determine which design system to use
          let designSystemId = selectedDesignSystem?.id || null;
          let designSystemBody = '';

          if (selectedDesignSystem?.isBuiltIn && selectedDesignSystem.id === 'claude') {
            // Use built-in Claude design system body
            designSystemBody = `You are designing with the Claude (Anthropic) design system. Use warm terracotta (#ff6b35), cream (#f7c59f), and neutral grays. Typography should feel clean, approachable, and professional.`;
          } else if (selectedDesignSystem && !selectedDesignSystem.isBuiltIn) {
            // Load the design system body from API
            try {
              const dsData = await API.get(`/design-systems/${selectedDesignSystem.id}`);
              designSystemBody = dsData.body || '';
            } catch {}
          }

          // Create project with plan mode data
          const manifest = await API.post('/projects', {
            name: projectName.trim(),
            designSystemId: designSystemId,
            pendingPrompt: `Create a ${fidelity} fidelity ${includeLanding ? 'landing page with' : ''} ${designSystemId || 'custom'} design.`,
            metadata: {
              fidelity,
              includeLanding,
              includeOSWidgets,
              selectedDesignSystem: selectedDesignSystem?.name || null,
              mode: activeTab
            }
          });

          // Reset form
          setProjectName('');
          setShowDesignSystemDropdown(false);

          // Open the new project
          onOpenProject(manifest.project);
        } catch (err) {
          alert('Error creating project: ' + err.message);
        }
      };

      const handleSelectDesignSystem = (sys) => {
        setSelectedDesignSystem(sys);
        if (sys.isBuiltIn && sys.id === 'claude') {
          // Built-in system - auto-select and close
          setShowDesignSystemDropdown(false);
        } else {
          setShowDesignSystemDropdown(false);
        }
      };

      const recentProjects = projects.slice(0, 5);

      return (
        <div style={{ display: 'flex', height: '100vh', background: '#fafafa', fontFamily: 'system-ui, -apple-system, sans-serif' }}>
          {/* Left Panel - Plan Mode */}
          <div style={{ width: '420px', background: '#fff', borderRight: '1px solid #e5e7eb', display: 'flex', flexDirection: 'column', overflowY: 'auto' }}>
            {/* Header */}
            <div style={{ padding: '20px 24px', borderBottom: '1px solid #f3f4f6' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '20px' }}>
                <div style={{ width: '32px', height: '32px', borderRadius: '8px', background: 'linear-gradient(135deg, #f97316, #fb923c)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 0-10 10"/></svg>
                </div>
                <h1 style={{ margin: 0, fontSize: '20px', fontWeight: '700', color: '#111827' }}>Open Design</h1>
              </div>

              {/* Tabs */}
              <div style={{ display: 'flex', gap: '0', borderBottom: '1px solid #e5e7eb', marginBottom: '20px' }}>
                {[
                  { id: 'prototype', label: 'Prototype' },
                  { id: 'live-artifact', label: 'Live artifact' },
                  { id: 'slide-deck', label: 'Slide deck' },
                  { id: 'from-template', label: 'From template' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    style={{
                      padding: '8px 16px',
                      border: 'none',
                      background: 'transparent',
                      borderBottom: activeTab === tab.id ? '2px solid #f97316' : '2px solid transparent',
                      color: activeTab === tab.id ? '#111827' : '#6b7280',
                      fontWeight: activeTab === tab.id ? '600' : '400',
                      fontSize: '13px',
                      cursor: 'pointer',
                      transition: 'all 0.2s'
                    }}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>

              {/* Project Name */}
              <div style={{ marginBottom: '16px' }}>
                <label style={{ display: 'block', fontSize: '13px', fontWeight: '500', color: '#374151', marginBottom: '6px' }}>
                  New prototype
                </label>
                <input
                  type="text"
                  placeholder="Project name"
                  value={projectName}
                  onChange={e => setProjectName(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') handleCreateProject(); }}
                  style={{ 
                    width: '100%', 
                    padding: '10px 14px', 
                    border: '1px solid #e5e7eb', 
                    borderRadius: '8px', 
                    fontSize: '14px',
                    outline: 'none',
                    boxSizing: 'border-box',
                    transition: 'border-color 0.2s'
                  }}
                  onFocus={e => e.target.style.borderColor = '#f97316'}
                  onBlur={e => e.target.style.borderColor = '#e5e7eb'}
                />
              </div>

              {/* Design System Dropdown */}
              <div style={{ marginBottom: '16px', position: 'relative' }}>
                <label style={{ display: 'block', fontSize: '13px', fontWeight: '500', color: '#374151', marginBottom: '6px' }}>
                  Design system
                </label>
                <button
                  onClick={() => setShowDesignSystemDropdown(!showDesignSystemDropdown)}
                  style={{ 
                    width: '100%', 
                    padding: '10px 14px', 
                    border: showDesignSystemDropdown ? '2px solid #f97316' : '1px solid #e5e7eb', 
                    borderRadius: '8px', 
                    fontSize: '14px',
                    background: '#fff',
                    cursor: 'pointer',
                    display: 'flex',
                    alignItems: 'center',
                    gap: '10px',
                    transition: 'all 0.2s'
                  }}
                >
                  {selectedDesignSystem ? (
                    <>
                      <div style={{ 
                        width: '28px', 
                        height: '28px', 
                        borderRadius: '6px', 
                        background: selectedDesignSystem.isBuiltIn && selectedDesignSystem.id === 'claude' 
                          ? 'linear-gradient(135deg, #ff6b35, #f7c59f)'
                          : 'linear-gradient(135deg, #f3f4f6 50%, #d1d5db 50%)',
                        display: 'flex', 
                        alignItems: 'center', 
                        justifyContent: 'center',
                        fontSize: '14px'
                      }}>
                        {selectedDesignSystem.isBuiltIn && selectedDesignSystem.id === 'claude' ? '🟠' : '🟦'}
                      </div>
                      <div style={{ flex: 1, textAlign: 'left' }}>
                        <div style={{ fontWeight: '500', color: '#111827' }}>{selectedDesignSystem.name}</div>
                        <div style={{ fontSize: '11px', color: '#6b7280' }}>{selectedDesignSystem.description?.substring(0, 40)}...</div>
                      </div>
                    </>
                  ) : (
                    <>
                      <div style={{ 
                        width: '28px', 
                        height: '28px', 
                        borderRadius: '6px', 
                        background: '#f3f4f6',
                        display: 'flex', 
                        alignItems: 'center', 
                        justifyContent: 'center'
                      }}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
                      </div>
                      <span style={{ color: '#9ca3af' }}>Select design system</span>
                    </>
                  )}
                  <svg style={{ marginLeft: 'auto', color: '#9ca3af' }} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="6 9 12 15 18 9"/></svg>
                </button>

                {showDesignSystemDropdown && (
                  <DesignSystemDropdown
                    systems={designSystems}
                    selectedId={selectedDesignSystem?.id}
                    onSelect={handleSelectDesignSystem}
                    onClose={() => setShowDesignSystemDropdown(false)}
                  />
                )}
              </div>

              {/* Companion Surfaces */}
              <div style={{ marginBottom: '16px' }}>
                <label style={{ display: 'block', fontSize: '13px', fontWeight: '500', color: '#374151', marginBottom: '8px' }}>
                  Companion surfaces

                <div style={{ 
                  padding: '12px', 
                  border: '1px solid #e5e7eb', 
                  borderRadius: '8px',
                  marginBottom: '8px',
                  display: 'flex',
                  alignItems: 'flex-start',
                  gap: '10px'
                }}>
                  <label style={{ flex: 1, cursor: 'pointer' }}>
                    <div style={{ fontWeight: '500', fontSize: '13px', color: '#111827', marginBottom: '2px' }}>
                      Include landing page
                    </div>
                    <div style={{ fontSize: '11px', color: '#6b7280', lineHeight: '1.4' }}>
                      Add a responsive marketing page for ads, waitlists, launch campaigns, app downloads, or product explanation.
                    </div>
                  </label>
                  <input
                    type="checkbox"
                    checked={includeLanding}
                    onChange={e => setIncludeLanding(e.target.checked)}
                    style={{ width: '18px', height: '18px', accentColor: '#f97316', flexShrink: 0 }}
                  />
                </div>

                <div style={{ 
                  padding: '12px', 
                  border: '1px solid #e5e7eb', 
                  borderRadius: '8px',
                  display: 'flex',
                  alignItems: 'flex-start',
                  gap: '10px'
                }}>
                  <label style={{ flex: 1, cursor: 'pointer' }}>
                    <div style={{ fontWeight: '500', fontSize: '13px', color: '#111827', marginBottom: '2px' }}>
                      Include OS widgets
                    </div>
                    <div style={{ fontSize: '11px', color: '#6b7280', lineHeight: '1.4' }}>
                      Available when iOS, Android, or tablet app is selected as a target platform.
                    </div>
                  </label>
                  <input
                    type="checkbox"
                    checked={includeOSWidgets}
                    onChange={e => setIncludeOSWidgets(e.target.checked)}
                    disabled
                    style={{ width: '18px', height: '18px', accentColor: '#f97316', flexShrink: 0, opacity: 0.5 }}
                  />
                </div>
              </div>

              {/* Fidelity */}
              <div style={{ marginBottom: '20px' }}>
                <label style={{ display: 'block', fontSize: '13px', fontWeight: '500', color: '#374151', marginBottom: '8px' }}>
                  Fidelity
                </label>
                <div style={{ display: 'flex', gap: '12px' }}>
                  <button
                    onClick={() => setFidelity('wireframe')}
                    style={{
                      flex: 1,
                      padding: '16px 12px',
                      border: fidelity === 'wireframe' ? '2px solid #3b82f6' : '1px solid #e5e7eb',
                      borderRadius: '8px',
                      background: fidelity === 'wireframe' ? '#eff6ff' : '#fff',
                      cursor: 'pointer',
                      textAlign: 'center',
                      transition: 'all 0.2s'
                    }}
                  >
                    <div style={{ marginBottom: '8px' }}>
                      <svg width="64" height="40" viewBox="0 0 64 40" fill="none">
                        <rect x="2" y="2" width="28" height="36" rx="2" stroke="#9ca3af" strokeWidth="1.5" fill="none"/>
                        <line x1="8" y1="10" x2="24" y2="10" stroke="#d1d5db" strokeWidth="1.5"/>
                        <line x1="8" y1="16" x2="20" y2="16" stroke="#d1d5db" strokeWidth="1.5"/>
                        <rect x="8" y="22" width="16" height="8" rx="1" stroke="#d1d5db" strokeWidth="1.5" fill="none"/>
                        <rect x="34" y="2" width="28" height="36" rx="2" stroke="#9ca3af" strokeWidth="1.5" fill="none"/>
                        <line x1="40" y1="10" x2="56" y2="10" stroke="#d1d5db" strokeWidth="1.5"/>
                        <line x1="40" y1="16" x2="52" y2="16" stroke="#d1d5db" strokeWidth="1.5"/>
                        <rect x="40" y="22" width="20" height="3" fill="#d1d5db"/>
                        <rect x="40" y="28" width="16" height="3" fill="#d1d5db"/>
                      </svg>
                    </div>
                    <div style={{ fontSize: '12px', color: '#374151', fontWeight: '500' }}>Wireframe</div>
                  </button>

                  <button
                    onClick={() => setFidelity('high')}
                    style={{
                      flex: 1,
                      padding: '16px 12px',
                      border: fidelity === 'high' ? '2px solid #3b82f6' : '1px solid #e5e7eb',
                      borderRadius: '8px',
                      background: fidelity === 'high' ? '#eff6ff' : '#fff',
                      cursor: 'pointer',
                      textAlign: 'center',
                      transition: 'all 0.2s'
                    }}
                  >
                    <div style={{ marginBottom: '8px' }}>
                      <svg width="64" height="40" viewBox="0 0 64 40" fill="none">
                        <rect x="2" y="2" width="28" height="36" rx="2" stroke="#374151" strokeWidth="1.5" fill="#f9fafb"/>
                        <rect x="6" y="6" width="20" height="6" rx="1" fill="#3b82f6" opacity="0.3"/>
                        <rect x="6" y="16" width="16" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="6" y="24" width="20" height="10" rx="2" fill="#f97316" opacity="0.3"/>
                        <rect x="34" y="2" width="28" height="36" rx="2" stroke="#374151" strokeWidth="1.5" fill="#f9fafb"/>
                        <rect x="38" y="6" width="20" height="6" rx="1" fill="#374151" opacity="0.3"/>
                        <rect x="38" y="16" width="16" height="4" rx="1" fill="#d1d5db"/>
                        <rect x="38" y="24" width="12" height="3" rx="1" fill="#f97316" opacity="0.5"/>
                        <rect x="38" y="30" width="16" height="3" rx="1" fill="#d1d5db"/>
                      </svg>
                    </div>
                    <div style={{ fontSize: '12px', color: '#374151', fontWeight: '600' }}>High fidelity</div>
                  </button>
                </div>
              </div>

              {/* Create Button */}
              <button
                onClick={handleCreateProject}
                disabled={!projectName.trim()}
                style={{ 
                  width: '100%', 
                  padding: '12px', 
                  border: 'none', 
                  borderRadius: '8px', 
                  background: projectName.trim() ? '#ea580c' : '#f3f4f6',
                  color: projectName.trim() ? '#fff' : '#9ca3af',
                  fontSize: '15px',
                  fontWeight: '600',
                  cursor: projectName.trim() ? 'pointer' : 'default',
                  transition: 'all 0.2s',
                  marginBottom: '12px'
                }}
              >
                + Create
              </button>

              {/* Import / Open */}
              <button 
                style={{ 
                  width: '100%', 
                  padding: '10px', 
                  border: '1px solid #e5e7eb', 
                  borderRadius: '8px', 
                  background: '#fff',
                  fontSize: '13px',
                  color: '#374151',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  gap: '8px',
                  marginBottom: '8px'
                }}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

              </button>
              
              <button 
                style={{ 
                  width: '100%', 
                  padding: '10px', 
                  border: '1px solid #e5e7eb', 
                  borderRadius: '8px', 
                  background: '#fff',
                  fontSize: '13px',
                  color: '#374151',
                  cursor: 'pointer',
                  display: 'flex',
                  alignItems: 'center',
                  justifyContent: 'center',
                  gap: '8px'
                }}
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                Open folder
              </button>

              <div style={{ textAlign: 'center', marginTop: '16px', fontSize: '11px', color: '#9ca3af' }}>
                Only you can see your project by default
              </div>
            </div>
          </div>

          {/* Right Panel - Recent Projects */}
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflowY: 'auto', padding: '24px' }}>
            {/* Right Panel Header */}
            <div style={{ marginBottom: '20px' }}>
              <h2 style={{ margin: 0, fontSize: '16px', fontWeight: '600', color: '#111827' }}>Recent</h2>
            </div>

            {recentProjects.length === 0 ? (
              <div style={{ textAlign: 'center', padding: '60px 20px', color: '#9ca3af' }}>
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" style={{ marginBottom: '12px', opacity: 0.5 }}><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
                <p style={{ fontSize: '14px' }}>No projects yet</p>
                <p style={{ fontSize: '12px', marginTop: '4px' }}>Create your first prototype to get started!</p>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>

                  <div

                    onMouseEnter={e => { e.currentTarget.style.borderColor = '#f97316'; e.currentTarget.style.boxShadow = '0 2px 8px rgba(249,115,22,0.1)'; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = '#e5e7eb'; e.currentTarget.style.boxShadow = 'none'; }}

    // ============================================================
    // APP ROOT
    // ============================================================
    function App() {
      const [config, setConfig] = useState({
        apiKey: '', apiProvider: 'anthropic', model: 'claude-sonnet-4-20250514',
        maxTokens: 8192, theme: 'light', accentColor: '#3b82f6',
        chatPanelWidth: 460, onboardingCompleted: false
      });
      const [activeProject, setActiveProject] = useState(null);
      const [settingsOpen, setSettingsOpen] = useState(false);

      useEffect(() => {
        // Load config
        API.get('/settings').then(data => setConfig(data)).catch(() => { });
      }, []);

      const handleSaveSettings = (newConfig) => {
        API.post('/settings', newConfig).then((saved) => {
          setConfig(saved);
          setSettingsOpen(false);
        }).catch(() => { });
      };

      if (!activeProject) {
        return (
          <>
            <EntryView
              onOpenProject={setActiveProject}
              onSettings={() => setSettingsOpen(true)}
            />
            {settingsOpen && (
              <SettingsDialog
                config={config}
                onClose={() => setSettingsOpen(false)}
                onSave={handleSaveSettings}
              />
            )}
          </>
        );
      }

      return (
        <div>
          <ProjectView
            project={activeProject}
            config={config}
            onBack={() => setActiveProject(null)}
          />
          {settingsOpen && (
            <SettingsDialog
              config={config}
              onClose={() => setSettingsOpen(false)}
              onSave={handleSaveSettings}
            />
          )}
        </div>
      );
    }

    // ============================================================
    // ERROR BOUNDARY
    // ============================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      render() {
        if (this.state.hasError) {
          return (
            <div style={{ padding: 40, fontFamily: 'sans-serif' }}>
              <h1 style={{ color: 'red' }}>⚠️ Something went wrong</h1>
              <pre style={{ background: '#fee', padding: 16, borderRadius: 8 }}>{this.state.error?.message}</pre>
              <p style={{ marginTop: 16 }}>Check the browser console (F12) for details.</p>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ============================================================
    // MOUNT
    // ============================================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
